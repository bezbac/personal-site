tasks:
  dev:
    command: "pnpm dev"
    platform: "node"
    local: true
    options:
      persistent: true

  build:
    command: "pnpm build"
    platform: "node"
    inputs:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
    outputs:
      - "dist/**"

  preview:
    command: "pnpm preview"
    platform: "node"
    local: true

  format-check:
    command: "pnpm format-check"
    platform: "node"
    options:
      cache: false

  format-write:
    command: "pnpm format-write"
    platform: "node"
    options:
      cache: false

  knip:
    command: "pnpm knip"
    platform: "node"
