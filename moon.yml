tasks:
  dev:
    command: "astro dev"
    preset: "server"

  build:
    command: "astro build"
    inputs:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
    outputs:
      - "dist/**"

  preview:
    command: "astro preview"
    options:
      runInCI: false

  format-check:
    command: "prettier --check ."
    options:
      cache: false

  format-write:
    command: "prettier --write ."
    options:
      cache: false

  knip:
    command: "knip"

  lint:
    script: "astro sync && eslint ."
    options:
      cache: false

  lint-fix:
    script: "astro sync && eslint --fix ."
    options:
      cache: false
