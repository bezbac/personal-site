tasks:
  dev:
    command: "astro dev"
    platform: "node"
    local: true
    options:
      persistent: true

  build:
    command: "astro build"
    platform: "node"
    inputs:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
    outputs:
      - "dist/**"

  preview:
    command: "astro preview"
    platform: "node"
    local: true

  format-check:
    command: "prettier --check ."
    platform: "node"
    options:
      cache: false

  format-write:
    command: "prettier --write ."
    platform: "node"
    options:
      cache: false

  knip:
    command: "knip"
    platform: "node"

  lint:
    command: "astro sync && eslint ."
    platform: "node"
    options:
      cache: false

  lint-fix:
    command: "astro sync && eslint --fix ."
    platform: "node"
    options:
      cache: false
